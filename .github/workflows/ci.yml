name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.3'
  GOLANGCI_LINT_VERSION: 'v2.12.1'
  GOVULNCHECK_VERSION: 'v1.1.4'
  BUF_VERSION: 'v1.70.0'
  GRPCURL_VERSION: 'v1.9.3'

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Repository metadata checks
        run: bash scripts/check-repository-metadata.sh
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          only-new-issues: true
          args: --config=.golangci.yml

  protobuf:
    name: Protobuf
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install buf and plugins
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/bufbuild/buf/cmd/buf@${{ env.BUF_VERSION }}
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: buf lint
        run: buf lint
      - name: buf generate
        run: buf generate
      - name: Generated files are committed
        run: git diff --exit-code -- gen

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }}
      - name: govulncheck
        run: govulncheck ./...

  test:
    name: Build + Test + Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.13-alpine3.23
        env:
          POSTGRES_USER: keychain
          POSTGRES_PASSWORD: keychain
          POSTGRES_DB: keychain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keychain"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go mod tidy
        run: go mod tidy
      - name: go.mod and go.sum are committed
        run: git diff --exit-code -- go.mod go.sum
      - name: go build
        run: go build ./...
      - name: go test (race + coverage)
        env:
          KEYCHAIN_TEST_POSTGRES_URL: postgres://keychain:keychain@localhost:5432/keychain?sslmode=disable
        run: bash scripts/run-coverage.sh
      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -n 20
      - name: Coverage gate (per-package)
        run: bash scripts/coverage-gate.sh cover.out --config .coverage-gates.yml
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: cover.out
          if-no-files-found: warn
          retention-days: 14

  smoke:
    name: Boot smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test -tags=smoke
        run: |
          if compgen -G "tests/smoke/*.go" > /dev/null; then
            go test -tags=smoke -timeout=120s ./tests/smoke/...
          else
            echo "no smoke tests under tests/smoke — skipping"
          fi

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Run fuzz targets (15s each)
        run: bash scripts/run-go-fuzz-targets.sh 15s

  docker:
    name: Docker Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: docker build --target server
        uses: docker/build-push-action@v7
        with:
          context: .
          target: server
          push: false
          load: true
          tags: keychain:ci
          cache-from: type=gha,scope=ci-docker
          cache-to: type=gha,mode=max,scope=ci-docker

  e2e:
    name: Docker Compose E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install grpcurl
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install github.com/fullstorydev/grpcurl/cmd/grpcurl@${{ env.GRPCURL_VERSION }}
      - name: Run Docker Compose e2e
        run: test/e2e/run-docker-compose-suite.sh

  security:
    name: Filesystem Vulnerability Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-24.04
    needs: [lint, protobuf, vuln, test, smoke, fuzz, docker, e2e, security]
    if: always()
    steps:
      - name: All required jobs succeeded
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          echo "$results" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          failed = [k for k, v in data.items() if v.get("result") != "success"]
          if failed:
            print("failed:", ", ".join(failed))
            sys.exit(1)
          print("all green")
          '
