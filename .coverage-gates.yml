# Per-package coverage floors. Thresholds are a regression ratchet: a change
# that drops a package below its floor fails CI. Raise a floor whenever
# coverage climbs comfortably above it.
default: 80

include:
  - internal/
  - cmd/
  - keychainserver
  - pkg/

packages:
  cmd/keychain: 95
  internal/config: 100
  keychainserver: 100
  keychainserver/store/conformance: 79
  keychainserver/store/memory: 100
  keychainserver/store/postgres: 95
  pkg/keymat: 100
