# Per-package coverage floors. Thresholds are a regression ratchet: a change
# that drops a package below its floor fails CI. Raise a floor whenever
# coverage climbs comfortably above it.
default: 70

include:
  - internal/
  - cmd/
  - keychainserver
  - pkg/

packages:
  cmd/keychain: 18
  internal/config: 85
  keychainserver: 72
  keychainserver/store/conformance: 75
  keychainserver/store/memory: 92
  keychainserver/store/postgres: 68
  pkg/keymat: 90
