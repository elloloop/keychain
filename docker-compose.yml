services:
  postgres:
    image: postgres:16.13-alpine3.23
    environment:
      POSTGRES_USER: keychain
      POSTGRES_PASSWORD: keychain
      POSTGRES_DB: keychain
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keychain"]
      interval: 5s
      timeout: 3s
      retries: 12

  keychain:
    build:
      context: .
      target: server
    environment:
      KEYCHAIN_GRPC_BIND_ADDR: 0.0.0.0:8080
      KEYCHAIN_METRICS_BIND_ADDR: 0.0.0.0:9090
      KEYCHAIN_POSTGRES_URL: postgres://keychain:keychain@postgres:5432/keychain?sslmode=disable
      KEYCHAIN_LOG_LEVEL: info
    ports:
      - "28080:8080"
      - "29090:9090"
    depends_on:
      postgres:
        condition: service_healthy
